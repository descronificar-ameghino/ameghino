<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La giganta — Leonora Carrington</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #141210;
      --ink: #f5efe4;
      --ink-light: #d8cfc2;
      --ink-faint: #8a7d6e;
      --accent: #c8a97a;
      --rule: #3a342c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: #0a0908; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* Image — full width, top */
    .obra-imagen {
      width: 100%;
      display: block;
      opacity: 0;
      animation: fadeIn 1.8s ease forwards 0.2s;
    }

    /* Content */
    .contenido {
      padding: 40px 36px 72px;
    }

    .rule { width: 100%; height: 1px; background: var(--rule); }
    .rule + .rule { margin-top: 4px; }

    /* Title block */
    .titulo-bloque {
      margin: 36px 0 32px;
      opacity: 0;
      animation: riseIn 1.4s ease forwards 0.6s;
    }

    .obra-titulo {
      font-family: 'IM Fell English', serif;
      font-size: 26px;
      font-weight: 400;
      font-style: italic;
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .obra-meta {
      font-family: 'IM Fell English SC', serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
      line-height: 1.8;
    }

    /* Divider rule */
    .rule-divider {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin: 28px 0;
      opacity: 0;
      animation: fadeIn 1.4s ease forwards 0.9s;
    }

    /* Context text */
    .contexto {
      opacity: 0;
      animation: riseIn 1.4s ease forwards 1.1s;
    }

    .contexto p {
      font-size: 18px;
      line-height: 1.85;
      color: var(--ink-light);
      font-weight: 400;
      margin-bottom: 14px;
      font-style: italic;
    }

    .contexto p:last-child { margin-bottom: 0; }



    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <img
    class="obra-imagen"
    src="../imagenes/Leonora-Carrington-La-giganta-1947.jpg"
    alt="La giganta, Leonora Carrington, 1947"
  >

  <div class="contenido">

    <div class="rule"></div>
    <div class="rule"></div>

    <div class="titulo-bloque">
      <div class="obra-titulo">La giganta</div>
      <div class="obra-meta">
        Leonora Carrington &nbsp;·&nbsp; 1947<br>
        Óleo sobre tela
      </div>
    </div>

    <div class="rule-divider"></div>

    <div class="contexto">
      <p>Leonora Carrington fue internada contra su voluntad en España en 1940. Pintó esto en México, en 1947, viviendo en comunidad.</p>
    </div>

  </div>

</body>
</html>
